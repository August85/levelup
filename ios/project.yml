# Generate the Xcode project on a Mac with:  brew install xcodegen && cd ios && xcodegen
name: LevelUP
options:
  bundleIdPrefix: com.august85
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LevelUP:
    type: application
    platform: iOS
    sources:
      - path: LevelUP
      - path: Shared
      # The web app's built data ships inside the app, so it works offline on first launch.
      - path: ../app/data/library.json
        buildPhase: resources
      - path: ../app/data/feeds.json
        buildPhase: resources
    info:
      path: LevelUP/Info.plist
      properties:
        CFBundleDisplayName: LevelUP
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: LevelUP/LevelUP.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.august85.levelup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.august85.levelup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ShareExtension
    # Interview Prep (course chapters and books) is private: it is copied in from your Mac at build
    # time and never committed. Without the folder the app builds fine and shows how to add it.
    postBuildScripts:
      - name: Bundle private Interview Prep content
        basedOnDependencyAnalysis: false
        script: |
          for SRC in "${LEVELUP_PRIVATE:-}" "$SRCROOT/Private" "$HOME/Desktop/levelupfiles/LevelUP-private"; do
            if [ -n "$SRC" ] && [ -f "$SRC/interview/index.json" ]; then
              echo "Bundling private content from $SRC"
              rsync -a --delete "$SRC/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Private/"
              exit 0
            fi
          done
          echo "warning: No private Interview Prep content found; the Interview Prep tab will explain how to add it."
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LevelUP
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.august85.levelup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.august85.levelup.share
        TARGETED_DEVICE_FAMILY: "1,2"
