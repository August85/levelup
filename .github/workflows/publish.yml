# Builds the library, fetches AI feeds and the Read Later inbox, and publishes the app to GitHub Pages.
# Runs on every push, every 3 hours (fresh feeds), and whenever a "read-later" issue is opened.
name: Publish app
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch AI feeds
        run: node scripts/fetch_feeds.mjs
      - name: Fetch Read Later inbox
        run: node scripts/fetch_inbox.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Build library
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
