# Compile-checks the native iOS app on a Mac runner (no signing), for every change under ios/.
name: iOS build
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LevelUP.xcodeproj -scheme LevelUP \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -n 200
